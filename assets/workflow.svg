<text x="812" y="275" fill="#172C36" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700">Classify</text>
<text x="812" y="317" fill="#52666E" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400">Category + priority</text>
<text x="812" y="347" fill="#52666E" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400">Local keyword rules</text>
