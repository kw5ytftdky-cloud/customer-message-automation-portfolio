<text x="1315" y="229" fill="#006B65" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700">6</text>
<text x="1308" y="275" fill="#172C36" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700">Preview</text>
<text x="1308" y="317" fill="#52666E" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400">Status: simulated</text>
<text x="1308" y="347" fill="#52666E" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400">No SMTP submission</text>
<text x="298" y="426" fill="#8E4A18" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700">Wrong key → 401</text>
<text x="546" y="426" fill="#8E4A18" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700">Invalid → 400 / 413</text>
<text x="50" y="502" fill="#52666E" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400">Configuration is checked before processing. Destinations stay under application control.</text>
<text x="50" y="547" fill="#8E4A18" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="400">Live OpenAI analysis and Gmail submission require separate authorization and validation.</text>
