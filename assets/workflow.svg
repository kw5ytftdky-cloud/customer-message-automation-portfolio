<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="580" viewBox="0 0 1600 580" role="img" aria-labelledby="title desc">
<title id="title">Customer message workflow — local demo</title>
<desc id="desc">Receive a message, authenticate the shared key, validate the JSON, classify and prioritize using demo rules, choose a department, and preview a simulated notification. Wrong keys are rejected with 401. Invalid requests return 400 or 413. No external provider is contacted by the demo.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#006B65"/></marker></defs>
<rect width="1600" height="580" rx="22" fill="#F4F7F6"/>
<text x="50" y="58" fill="#006B65" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="700">WORKFLOW ILLUSTRATION / LOCAL DEMO</text>
<text x="50" y="121" fill="#172C36" font-family="DejaVu Sans,Arial,sans-serif" font-size="44" font-weight="700">From incoming request to a reviewable handoff.</text>
<rect x="50" y="189" width="228" height="191" rx="18" fill="white" stroke="#D9E3E1" stroke-width="2"/>
<circle cx="81" cy="222" r="17" fill="#DCEFEB"/>
<text x="75" y="229" fill="#006B65" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700">1</text>
<text x="68" y="275" fill="#172C36" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700">Receive</text>
<text x="68" y="317" fill="#52666E" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400">POST /message</text>
<text x="68" y="347" fill="#52666E" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400">Fictional JSON</text>
