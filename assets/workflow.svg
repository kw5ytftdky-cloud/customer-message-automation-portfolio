<text x="316" y="275" fill="#172C36" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700">Authenticate</text>
<text x="316" y="317" fill="#52666E" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400">Shared API key</text>
<text x="316" y="347" fill="#52666E" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400">Required for intake</text>
