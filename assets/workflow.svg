<text x="1060" y="317" fill="#52666E" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400">Approved service</text>
<text x="1060" y="347" fill="#52666E" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400">Fictional destination</text>
