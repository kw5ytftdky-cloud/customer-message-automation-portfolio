<text x="571" y="229" fill="#006B65" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700">3</text>
<text x="564" y="275" fill="#172C36" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="700">Validate</text>
<text x="564" y="317" fill="#52666E" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400">Required fields</text>
<text x="564" y="347" fill="#52666E" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="400">32 KiB body limit</text>
